<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMART Med UDH · ระบบออนไลน์ อายุรกรรมอุดรธานี</title>
<meta name="description" content="ศูนย์รวมระบบออนไลน์ กลุ่มงานอายุรกรรม โรงพยาบาลอุดรธานี">
<meta name="theme-color" content="#F2B8C6">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SMART Med">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply the saved text size before the page paints
  try { var z = localStorage.getItem('text-size'); if (z) document.documentElement.style.setProperty('--z', z); } catch (e) {}
</script>
<style>
  :root{
    --accent:#F2B8C6; --accent-soft:#FCEBEF; --ink:#111111; --ink-2:#4A4A4A; --ink-3:#7A7A7A;
    --bg:#FBF8F8; --card:#FFFFFF; --line:#EEE4E6; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Prompt",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:calc(100vh / var(--z,1));display:flex;flex-direction:column;zoom:var(--z,1)}
  a{color:inherit;text-decoration:none}
  .wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}

  /* Header */
  header{background:var(--card);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent)}
  .head{display:flex;align-items:center;gap:18px;padding-block:28px 30px;flex-wrap:wrap}
  .head .title{flex:1;min-width:200px}

  /* Text size control */
  .fs{display:flex;align-items:center;gap:10px}
  .fs-label{font-size:13.5px;color:var(--ink-2);font-weight:500}
  .fs-btns{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .fs-btns button{font:inherit;font-weight:600;line-height:1;border:0;background:none;color:var(--ink-2);width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
  .fs-btns button+button{border-left:1px solid var(--line)}
  .fs-btns button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
  .fs-btns button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .mark{width:72px;height:72px;flex:none;border-radius:20px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
  .mark img{width:56px;height:auto}
  h1{font-size:clamp(26px,5vw,36px);font-weight:700;letter-spacing:-.01em;line-height:1.1}
  h1 .smart{background:linear-gradient(transparent 62%,var(--accent) 62%,var(--accent) 92%,transparent 92%);padding:0 2px}
  .th{font-size:clamp(15px,2.6vw,18px);color:var(--ink-2);font-weight:500;margin-top:4px}

  main{flex:1;padding:28px 0 40px}
  .label{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px 2px}

  /* Cards */
  .grid{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;position:relative}
  a.card:hover,a.card:focus-visible{transform:translateY(-2px);border-color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.08);outline:none}
  a.card:active{transform:translateY(0)}
  .ic{width:52px;height:52px;flex:none;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center}
  .ic svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .body{flex:1;min-width:0}
  .name{font-size:18px;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .thname{font-size:15px;color:var(--ink-2);margin-top:2px}
  .arrow{position:absolute;top:20px;right:20px;width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;transition:stroke .15s,transform .15s}
  a.card:hover .arrow{stroke:var(--ink);transform:translate(2px,-2px)}
  .card .body{padding-right:20px}
  .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#F5ECEE;color:var(--ink-2);white-space:nowrap}
  .tag.soon{background:var(--accent);color:var(--ink)}

  /* Group card (Sepsis) */
  .group{grid-column:1/-1;flex-direction:column}
  @media(min-width:700px){.group{grid-column:span 2}}
  .group .top{display:flex;gap:16px;align-items:flex-start;width:100%}
  .subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;width:100%;margin-top:4px}
  .sub{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);transition:border-color .15s,background .15s}
  .sub:hover,.sub:focus-visible{border-color:var(--ink);background:#fff;outline:none}
  .sub .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);flex:none}
  .sub .t1{font-weight:600;font-size:15.5px;line-height:1.3}
  .sub .t2{font-size:14px;color:var(--ink-2)}
  .sub svg{margin-left:auto;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}

  .card.disabled{opacity:.6;box-shadow:none;background:transparent;border-style:dashed}

  /* Contact (LINE OA) */
  .section{margin-top:30px}
  .section:first-child{margin-top:0}
  .sec-h{display:flex;align-items:flex-start;gap:10px;line-height:1.45;font-size:18px;font-weight:600;margin:0 0 12px 2px}
  .sec-n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:700}
  .sec-en{display:inline-block;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
  .ic.line{background:#06C755}
  .ic.line svg{stroke:none;fill:#fff;width:30px;height:30px}
  .line-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:#06C755;color:#fff;font-size:14px;font-weight:600}

  /* Add to Home Screen */
  .a2hs{display:none;align-items:center;gap:12px 14px;flex-wrap:wrap;position:relative;padding-right:44px !important;background:var(--accent-soft);border:1px solid var(--accent);border-radius:18px;padding:14px 16px;margin-bottom:20px}
  .a2hs.show{display:flex}
  .a2hs img{width:44px;height:44px;border-radius:11px;flex:none;border:1px solid var(--line);background:#fff}
  .a2hs .txt{flex:1 1 150px;min-width:0}
  .a2hs .t1{font-weight:600;font-size:15.5px;line-height:1.3}
  .a2hs .t2{font-size:13.5px;color:var(--ink-2)}
  .btn{font:inherit;font-weight:600;font-size:14.5px;border:0;border-radius:999px;padding:9px 16px;background:var(--ink);color:#fff;cursor:pointer;white-space:nowrap}
  .x{font:inherit;border:0;background:none;color:var(--ink-3);font-size:22px;line-height:1;padding:8px;cursor:pointer;position:absolute;top:6px;right:6px}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .sheet-bg.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:19px;font-weight:600;margin-bottom:14px}
  .sheet ol{list-style:none;display:grid;gap:12px;margin-bottom:18px}
  .sheet li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px}
  .sheet .n{width:26px;height:26px;border-radius:50%;background:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
  .sheet .k{display:inline-flex;align-items:center;gap:4px;font-weight:600;background:#F5ECEE;border-radius:6px;padding:0 6px}
  .sheet .k svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
  .sheet .note{font-size:13.5px;color:var(--ink-3);margin:-6px 0 16px}
  .sheet .btn{width:100%;padding:12px}

  footer{border-top:1px solid var(--line);background:var(--card)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;flex-wrap:wrap}
  .foot img{height:44px;width:auto}
  .foot p{font-size:13.5px;color:var(--ink-3)}

  @media(max-width:480px){
    .wrap{padding:0 16px}
    .head{gap:14px;padding-block:22px 24px}
    .mark{width:60px;height:60px;border-radius:16px}.mark img{width:46px}
    .grid{grid-template-columns:1fr}
    .card{padding:16px;gap:14px}
    .ic{width:46px;height:46px}.ic svg{width:24px;height:24px}
    .arrow{top:16px;right:16px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <div class="mark"><img src="assets/logo-mark.png" alt="Internal Medicine UDH logo"></div>
    <div class="title">
      <h1><span class="smart">SMART</span> Med UDH</h1>
      <div class="th">ระบบออนไลน์ อายุรกรรมอุดรธานี</div>
    </div>
    <div class="fs" role="group" aria-label="ขนาดตัวอักษร">
      <span class="fs-label">ขนาดตัวอักษร</span>
      <div class="fs-btns">
        <button type="button" data-z="1" style="font-size:15px" aria-label="ขนาดปกติ">ก</button>
        <button type="button" data-z="1.15" style="font-size:19px" aria-label="ขนาดใหญ่">ก</button>
        <button type="button" data-z="1.3" style="font-size:24px" aria-label="ขนาดใหญ่มาก">ก</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="a2hs" id="a2hs">
      <img src="assets/apple-touch-icon.png" alt="">
      <div class="txt">
        <div class="t1">เพิ่ม SMART Med ไว้ที่หน้าจอโฮม</div>
        <div class="t2">เปิดใช้งานได้ทันทีเหมือนแอป</div>
      </div>
      <button class="btn" id="a2hsBtn">เพิ่ม</button>
      <button class="x" id="a2hsX" aria-label="ปิด">×</button>
    </div>

    <div id="sections"></div>
  </div>
</main>

<div class="sheet-bg" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet">
    <h2 id="sheetTitle">เพิ่มไปยังหน้าจอโฮม</h2>
    <ol id="steps"></ol>
    <p class="note" id="sheetNote"></p>
    <button class="btn" id="sheetClose">เข้าใจแล้ว</button>
  </div>
</div>

<footer>
  <div class="wrap foot">
    <img src="assets/logo-full.png" alt="Internal Medicine UDH">
    <p>กลุ่มงานอายุรกรรม โรงพยาบาลอุดรธานี<span id="a2hsFoot" hidden> · <a href="#" style="text-decoration:underline">เพิ่มไปหน้าจอโฮม</a></span></p>
  </div>
</footer>

<script>
/* ==========================================================
   EDIT LINKS HERE — sections and the apps inside them.
   Order on the page = order in this list.
   url: "" shows the card as "เร็วๆ นี้ / Coming soon".
   ========================================================== */
const SECTIONS = [
  { title: "สำหรับบุคลากรทั่วไป", en: "For all staff", apps: [
    { name: "MedUDH Consult Search", th: "ดูตารางรับปรึกษา อายุรกรรม", icon: "table",
      url: "https://script.google.com/macros/s/AKfycbzMFSh-Ext_qAOLtmXwV3LVMEvyCGh3nHamlxrGhLirRJOCYotyi90not4DGha1oAYdow/exec" },
    { name: "Consult Med UDH", th: "ระบบปรึกษาอายุรกรรม อุดรธานี", icon: "consult",
      url: "https://script.google.com/macros/s/AKfycbztzi1eQELUaGIJJQBV8xUlo713mL523KpYpZ9hmjnI6gFl2-kq1L7CZmguVbQ7JhBKEw/exec" },
    { name: "Classroom Reservation", th: "จองห้องประชุม อายุรกรรมอุดรธานี", icon: "room",
      url: "https://script.google.com/macros/s/AKfycbx4DJCuDu0VUoQSDid24VXr9QxvQvGRLx4Sw41f6Cpw8CHRlGOOs4exMVmMPY5ut7mU/exec" },
    { name: "SMART ICU UDH", th: "จองเตียง ICU รพ.อุดรธานี", icon: "icu", tag: "ระบบ รพ.",
      url: "https://www.smartudh.com" },
    { name: "RapID", th: "ระบบช่วยตัดสินใจ การให้ยา antibiotics", icon: "abx",
      url: "https://rapidv3.vercel.app" },
    { name: "LINE Official Account", th: "อายุรกรรมอุดรธานี", icon: "line", line: true,
      url: "https://lin.ee/OLBnJsf" }
  ]},
  { title: "สำหรับ Service plan sepsis", en: "Sepsis service plan", apps: [
    { name: "Sepsis UDH", th: "ระบบรายงานผู้ป่วย Sepsis", icon: "sepsis", group: [
        { name: "Sepsis Mortality Report", th: "รายงานเคสผู้ป่วย Sepsis เสียชีวิต",
          url: "https://script.google.com/macros/s/AKfycbzoh0KIqiG-2p2_AS_m4CE08-GF5jBf5UWqFFkBXjV5fNnGPGlRRVsCnwuLsDHBDIUP/exec" },
        { name: "Sepsis Tracker", th: "รายงานเคสผู้ป่วย Sepsis, pneumonia",
          url: "https://script.google.com/macros/s/AKfycbz-Qrq9gAYlqvueQIRVUpK8FeiXU9FhI6b43TBajVKFcQquDh3ZijlpznY3HV1QWI0D/exec" }
    ]}
  ]},
  { title: "สำหรับอายุรแพทย์", en: "", apps: [
    { name: "Internal Medicine Staff Workload", th: "ระบบจัดการภาระงาน อายุรแพทย์ อุดรธานี", icon: "workload",
      url: "https://script.google.com/macros/s/AKfycbxux2XveRPBZtseeyiT2RPlOIVHmk75z3TrhTPP3xA-fYs7492Uh89jF_rM3UaaYfzteQ/exec" },
    { name: "Medicine Staff Shift Management", th: "ระบบจัดเวรอายุรแพทย์", icon: "shift",
      url: "https://script.google.com/macros/s/AKfycbxe_MufciKeol6nN5X9uzvdodYn7ZDumHE0cvYf-pDo_1AZciJ567hU_pifPKPPH1On/exec" }
  ]}
];

const ICONS = {
  workload:'<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4M8 13.5h3M8 17h6"/>',
  consult:'<path d="M5 3.5v5a4 4 0 0 0 8 0v-5"/><path d="M9 12.5v2.5a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="11" r="2"/>',
  sepsis:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',
  room:'<path d="M4 20.5V6.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14"/><path d="M2.5 20.5h19M9 10h6M9 14h6"/>',
  icu:'<path d="M3 18V7M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10.5" r="1.8"/>',
  line:'<path d="M12 3.2c-5 0-9 3.3-9 7.4 0 3.7 3.2 6.8 7.6 7.3.3.1.7.2.8.5.1.2.1.6 0 .9l-.1.8c0 .2-.2.9.8.5s5.5-3.3 7.5-5.6c1.4-1.5 2.4-3 2.4-4.4 0-4.1-4-7.4-9-7.4z"/>',
  table:'<path d="M20.5 10V6.5a2 2 0 0 0-2-2h-13a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10M3.5 9.5h17M9 4.5v15"/><circle cx="16.2" cy="16.2" r="3.2"/><path d="M18.6 18.6l2.4 2.4"/>',
  shift:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  abx:'<rect x="2.8" y="8.6" width="18.4" height="6.8" rx="3.4" transform="rotate(-45 12 12)"/><path d="M9.6 9.6l4.8 4.8"/>'
};
const ARROW = '<path d="M7 17L17 7M9 7h8v8"/>';
const svg = (p, cls) => `<svg viewBox="0 0 24 24" ${cls?`class="${cls}"`:''} aria-hidden="true">${p}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const card = a => {
  const icon = `<div class="ic${a.line?' line':''}">${svg(ICONS[a.icon] || ICONS.sepsis)}</div>`;
  if (a.group) {
    return `<div class="card group">
      <div class="top">${icon}<div class="body"><div class="name">${esc(a.name)}</div><div class="thname">${esc(a.th)}</div></div></div>
      <div class="subs">${a.group.map(s => `
        <a class="sub" href="${esc(s.url)}" target="_blank" rel="noopener">
          <span class="dot"></span><span><div class="t1">${esc(s.name)}</div><div class="t2">${esc(s.th)}</div></span>${svg(ARROW)}
        </a>`).join('')}
      </div></div>`;
  }
  const tag = a.url ? (a.tag ? `<span class="tag">${esc(a.tag)}</span>` : '') : '<span class="tag soon">เร็วๆ นี้</span>';
  const extra = a.line ? '<span class="line-btn">+ เพิ่มเพื่อน</span>' : '';
  const inner = `${icon}<div class="body"><div class="name">${esc(a.name)} ${tag}</div><div class="thname">${esc(a.th)}</div>${extra}</div>`;
  return a.url
    ? `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">${inner}${svg(ARROW,'arrow')}</a>`
    : `<div class="card disabled" aria-disabled="true">${inner}</div>`;
};

document.getElementById('sections').innerHTML = SECTIONS.map((sec, i) => `
  <section class="section">
    <h2 class="sec-h"><span class="sec-n">${i + 1}</span><span>${esc(sec.title)} &ensp;<span class="sec-en">${esc(sec.en || '')}</span></span></h2>
    <div class="grid">${sec.apps.map(card).join('')}</div>
  </section>`).join('');

/* ---------- Add to Home Screen ---------- */
(function () {
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const inApp = /Line\/|FBAN|FBAV|Instagram/i.test(ua);           // LINE / Facebook in-app browser
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const banner = document.getElementById('a2hs'), sheet = document.getElementById('sheet');
  let deferred = null, dismissed = false;
  try { dismissed = localStorage.getItem('a2hs-dismissed') === '1'; } catch (e) {}

  if (standalone || !(isIOS || isAndroid)) return;
  if (!dismissed) banner.classList.add('show');
  const foot = document.getElementById('a2hsFoot');
  foot.hidden = false;
  foot.querySelector('a').onclick = e => { e.preventDefault(); document.getElementById('a2hsBtn').onclick(); };

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', () => banner.classList.remove('show'));

  const share = '<span class="k"><svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 11v9h14v-9"/></svg>แชร์</span>';
  const dots  = '<span class="k">⋮</span>';
  const step  = (n, html) => `<li><span class="n">${n}</span><span>${html}</span></li>`;

  function show() {
    let steps, note = '';
    if (inApp) {
      steps = [
        `กดปุ่ม ${isIOS ? '<span class="k">⋯</span> หรือ ' + share : dots} มุมขวา`,
        `เลือก <b>เปิดใน${isIOS ? ' Safari' : ' Chrome'}</b> (Open in browser)`,
        'กดปุ่ม <b>เพิ่ม</b> บนหน้านี้อีกครั้ง'
      ];
      note = 'ต้องเปิดผ่านเบราว์เซอร์ก่อน แอป LINE ไม่สามารถเพิ่มไปหน้าจอโฮมได้โดยตรง';
    } else if (isIOS) {
      steps = [
        `กดปุ่ม ${share} ด้านล่าง (หรือด้านบน) ของ Safari`,
        'เลื่อนลงแล้วเลือก <b>เพิ่มไปยังหน้าจอโฮม</b> (Add to Home Screen)',
        'กด <b>เพิ่ม</b> มุมขวาบน'
      ];
      note = 'ต้องเปิดด้วย Safari บน iPhone/iPad';
    } else {
      steps = [
        `กดปุ่ม ${dots} มุมขวาบนของ Chrome`,
        'เลือก <b>เพิ่มลงในหน้าจอหลัก</b> หรือ <b>ติดตั้งแอป</b>',
        'กด <b>เพิ่ม</b> / <b>ติดตั้ง</b>'
      ];
    }
    document.getElementById('steps').innerHTML = steps.map((s, i) => step(i + 1, s)).join('');
    document.getElementById('sheetNote').textContent = note;
    sheet.classList.add('show');
  }

  document.getElementById('a2hsBtn').onclick = async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; return; }
    show();
  };
  document.getElementById('a2hsX').onclick = () => {
    banner.classList.remove('show');
    try { localStorage.setItem('a2hs-dismissed', '1'); } catch (e) {}
  };
  document.getElementById('sheetClose').onclick = () => sheet.classList.remove('show');
  sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove('show'); };
})();

/* ---------- Text size ---------- */
(function () {
  const btns = [...document.querySelectorAll('.fs-btns button')];
  let cur = '1';
  try { cur = localStorage.getItem('text-size') || '1'; } catch (e) {}
  if (!btns.some(b => b.dataset.z === cur)) cur = '1';
  const apply = z => {
    document.documentElement.style.setProperty('--z', z);
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.z === z));
    try { localStorage.setItem('text-size', z); } catch (e) {}
  };
  btns.forEach(b => b.onclick = () => apply(b.dataset.z));
  apply(cur);
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
